# hermes.conf — model configuration for setup-hermes.sh
#
# Sourced by setup-hermes.sh.
#
# DEFAULTS AS SHIPPED are tuned for an 8 GB dGPU (RTX 4060) — see README.md,
# "Context length: what actually happens" for the full rationale and the
# hard-won findings behind these specific choices.

# Named model aliases: "name=ollama-model-tag" pairs, one per line. Each
# becomes a `hermes -m <name>` target and a model_aliases entry in
# config.yaml. This is a bash array, so it isn't env-var-overridable like
# the scalars below — edit it directly.
#
# Before adding a second/fallback model here, read README.md — Hermes
# refuses any model whose real context is below 64K, and forcing a model
# above its real context to clear that bar can blow your VRAM budget
# instead (confirmed: a model with 40960 real context, forced to 65536+,
# spilled 22% onto CPU and went from 5s to 70s+ per request on this
# hardware). There's no per-alias context override in Hermes' config
# schema (checked its source) — context_length/OLLAMA_BASE_URL below apply
# globally to every alias.
HERMES_ALIASES=(
    "local=qwen3.5:4b"
)

# Which alias above Hermes uses when you don't pass -m. Must be a key that
# exists in HERMES_ALIASES.
: "${HERMES_DEFAULT_ALIAS:=local}"

# Written to config.yaml as `context_length` — a CEILING on whatever Hermes
# auto-detects per-model from Ollama's /api/show, not a forced value (see
# README.md). Must not exceed what fits in VRAM at your chosen KV cache
# quantization.
: "${HERMES_CONTEXT_LENGTH:=131072}"

# Ollama's OpenAI-compatible endpoint — applies to all aliases above.
: "${OLLAMA_BASE_URL:=http://localhost:11434/v1}"

# Scalars above can be overridden by exporting the same-named env var before
# running setup-hermes.sh (an exported var always wins over the file's
# default). HERMES_ALIASES, being an array, can't be — edit it directly.
