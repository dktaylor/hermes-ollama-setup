# hermes.conf — model configuration for setup-hermes.sh
#
# Sourced by setup-hermes.sh.
#
# DEFAULTS AS SHIPPED are tuned for an 8 GB dGPU (RTX 4060) — see README.md
# for the full rationale (q8_0 KV cache quantization, 131072 context).

# Named model aliases: "alias-name=ollama-model-tag" pairs, one per line.
# Each becomes a `hermes -m <alias-name>` target — add as many as you want,
# e.g. a fast small model, a big-context model, a coding-tuned model. This
# is a bash array, so it isn't env-var-overridable like the scalars below —
# edit it directly.
HERMES_ALIASES=(
    "local=qwen3.5:4b"
    "local-8b=qwen3:8b"
)

# Which alias above Hermes uses when you don't pass -m. Must be a key that
# exists in HERMES_ALIASES.
: "${HERMES_DEFAULT_ALIAS:=local}"

# Context length written to both `context_length` and `ollama_num_ctx` in
# config.yaml — applies to all aliases above. Must not exceed what your
# Ollama daemon is actually configured for (OLLAMA_CONTEXT_LENGTH) or what
# fits in VRAM at your chosen KV cache quantization — see README.md.
: "${HERMES_CONTEXT_LENGTH:=131072}"

# Ollama's OpenAI-compatible endpoint — applies to all aliases above.
: "${OLLAMA_BASE_URL:=http://localhost:11434/v1}"

# Scalars above can be overridden by exporting the same-named env var before
# running setup-hermes.sh (an exported var always wins over the file's
# default). HERMES_ALIASES, being an array, can't be — edit it directly.
